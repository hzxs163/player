pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// 零第三方依赖不等于零仓库：aapt2、zipflinger 这些构建工具本身是 AGP 声明的「外部构件」，
// 走的是项目级仓库而不是 pluginManagement。少了下面这段，mergeReleaseResources 会报
// "Cannot resolve external dependency com.android.tools.build:aapt2 ... no repositories are defined"。
// FAIL_ON_PROJECT_REPOS 让仓库只认这一处，模块里再冒出一个 repositories{} 就直接失败。
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'shibo'
include ':app'
