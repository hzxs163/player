# 临时排障用：作业日志匿名 API 拿不到（403），匿名限额又是 60/小时，
# 所以把完整构建日志压回一个 ci-logs 分支 —— 本地用 SSH fetch 读，不受限额影响。
# 提交信息带 ci-report 才会跑；定位完就把这个文件和 ci-logs 分支一起删掉。
# 阶段刻意和 build-app.yml 一一对应：这里全绿了再推标签，免得 Release 发一半卡住。
name: ci-report
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ci-report
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'ci-report')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: 按 build-app.yml 的顺序跑一遍
        continue-on-error: true
        run: |
          set -uo pipefail
          L=build.log
          : > "$L"
          say() { echo "### $*" | tee -a "$L"; }
          stage() {
            local name="$1"; shift
            say "== $name"
            "$@" >> "$L" 2>&1
            say "-- $name exit=$?"
          }
          stage "同步站点文件进 assets" node scripts/sync-www.mjs
          stage "构建 release APK" gradle -p android assembleRelease --no-daemon \
            --console=plain -Pshibo.version=1.0.0
          say "== 产物"
          ls -l android/app/build/outputs/apk/release/ 2>&1 | tee -a "$L"
          APK=android/app/build/outputs/apk/release/app-release.apk
          stage "导出签名证书 DER" bash -c \
            "keytool -list -rfc -keystore android/keystore/shibo.p12 -storetype PKCS12 \
             -storepass shibo-android -alias shibo 2>/dev/null \
             | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > cert.pem \
             && test -s cert.pem && openssl x509 -in cert.pem -noout -subject -dates \
             && openssl x509 -in cert.pem -outform der -out cert.der"
          stage "校验 APK" node scripts/verify-apk.mjs "$APK" --cert cert.der
          say "== 完成"
      - name: 摘要贴成 commit comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "## 安卓构建回执（run $GITHUB_RUN_ID）"
            echo '```'
            grep -nE "^### |^-- |error:|FAILURE|FAILED|What went wrong|BUILD |Could not" build.log | tail -n 40 || true
            echo '```'
          } > report.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat report.md)" -q .html_url || true
      - name: 完整日志压回 ci-logs 分支
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 空仓库单独建：直接在主工作区开孤儿分支会把整棵 main 一起提交进去
          rm -rf ../cilog && mkdir -p ../cilog && cd ../cilog
          git init -q
          git config user.name "ci-report"
          git config user.email "ci-report@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/build.log" "android-${GITHUB_SHA:0:7}.log"
          git add -A
          git commit -qm "ci log ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY.git" \
            HEAD:refs/heads/ci-logs
